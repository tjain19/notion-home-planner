name: Sunday summary

on:
  schedule:
    # 7pm Eastern is 23:00 UTC in summer and 00:00 UTC Monday in winter.
    # GitHub can start scheduled runs hours late, so try hourly from 7pm through about 11pm Eastern.
    # The script posts only on Sunday from 6:30pm Eastern, and only if this week's page doesn't exist yet.
    - cron: "0 23 * * 0"
    - cron: "0 0-4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the page without creating it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: family-tasks
  cancel-in-progress: false

jobs:
  run:
    # Skips quietly until the repo is configured (e.g. in forks or this public copy).
    if: vars.NOTION_DATA_SOURCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Manual runs post immediately (--force); scheduled runs check the Sunday window.
      - run: python -m family_tasks weekly ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          NOTION_SUMMARY_PAGE_ID: ${{ vars.NOTION_SUMMARY_PAGE_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || (vars.LIVE == 'true' && 'false' || 'true') }}
